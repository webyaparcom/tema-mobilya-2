<style>
  /* deger-doku-karo — hizmet-bento/deger-cam düz zeminli hücrelerdir; burada her karonun zemini bir malzeme dokusudur, etiket kartı dokunun üstünde durur ve karo tıklanınca ızgarada büyür (cevir → 2×2). */
  .modulex-deger-doku-karo { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-deger-doku-karo *, .modulex-deger-doku-karo *::before, .modulex-deger-doku-karo *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-deger-doku-karo :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-deger-doku-karo :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }

  .modulex-deger-doku-karo-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-deger-doku-karo-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-deger-doku-karo-ust { grid-column: 1 / -1; }
  .modulex-deger-doku-karo-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-deger-doku-karo-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-deger-doku-karo-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-deger-doku-karo-bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(220px, auto); grid-auto-flow: dense; gap: 14px; }
  .modulex-deger-doku-karo-karo--ana, .modulex-deger-doku-karo-karo:has(.modulex-deger-doku-karo--acik) { grid-column: span 2; grid-row: span 2; }
  .modulex-deger-doku-karo-karo:last-child:nth-child(4n) { grid-column: span 2; }

  .modulex-deger-doku-karo-kap .modulex-deger-doku-karo-bag::after { content: none; }
  .modulex-deger-doku-karo-doku { position: absolute; inset: 0; z-index: -1; transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-deger-doku-karo-doku img { width: 100%; height: 100%; object-fit: cover; }
  .modulex-deger-doku-karo-kap:hover .modulex-deger-doku-karo-doku, .modulex-deger-doku-karo-kap:focus-visible .modulex-deger-doku-karo-doku, .modulex-deger-doku-karo--acik .modulex-deger-doku-karo-doku { transform: scale(1.12); }
  .modulex-deger-doku-karo-doku--0 .modulex-deger-doku-karo-doku { background: repeating-linear-gradient(97deg, color-mix(in srgb, --accent-- 42%, --bg--) 0 7px, color-mix(in srgb, --accent-- 28%, --bg--) 7px 10px, color-mix(in srgb, --accent-- 36%, --bg--) 10px 19px); }
  .modulex-deger-doku-karo-doku--1 .modulex-deger-doku-karo-doku { background-color: --kartBg--; background-image: repeating-linear-gradient(0deg, color-mix(in srgb, --text-- 9%, transparent) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, color-mix(in srgb, --text-- 9%, transparent) 0 1px, transparent 1px 4px); }
  .modulex-deger-doku-karo-doku--2 .modulex-deger-doku-karo-doku { background: radial-gradient(120% 60% at 20% 30%, transparent 40%, color-mix(in srgb, --text-- 12%, transparent) 41%, transparent 43%), radial-gradient(90% 80% at 80% 70%, transparent 50%, color-mix(in srgb, --text-- 14%, transparent) 51%, transparent 53%), linear-gradient(135deg, --bg--, --kartBg--); }
  .modulex-deger-doku-karo-doku--3 .modulex-deger-doku-karo-doku { background: repeating-linear-gradient(90deg, color-mix(in srgb, --text-- 8%, transparent) 0 1px, transparent 1px 3px), linear-gradient(160deg, color-mix(in srgb, --text-- 30%, --bg--), color-mix(in srgb, --text-- 12%, --bg--) 50%, color-mix(in srgb, --text-- 32%, --bg--)); }
  .modulex-deger-doku-karo-etiketlik { display: grid; gap: 6px; padding: 16px 18px; border-radius: calc(--yuvarlak-- * 0.7); background: color-mix(in srgb, --bg-- 92%, transparent); color: --text--; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform 0.4s ease; }
  .modulex-deger-doku-karo-kap:hover .modulex-deger-doku-karo-etiketlik { transform: translateY(-4px); }
  .modulex-deger-doku-karo-ikon { color: --accentInk--; font-size: 26px; }
  .modulex-deger-doku-karo-etiket { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-deger-doku-karo-kbaslik { font-size: 1.1rem; font-weight: 750; }
  .modulex-deger-doku-karo-karo--ana .modulex-deger-doku-karo-kbaslik, .modulex-deger-doku-karo--acik .modulex-deger-doku-karo-kbaslik { font-size: clamp(1.35rem, 2.4vw, 1.9rem); }
  .modulex-deger-doku-karo-kmetin { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; color: --muted--; font-size: 0.93rem; }
  .modulex-deger-doku-karo-karo--ana .modulex-deger-doku-karo-kmetin, .modulex-deger-doku-karo--acik .modulex-deger-doku-karo-kmetin { -webkit-line-clamp: 8; }
  .modulex-deger-doku-karo-buyut { position: absolute; inset-block-start: 12px; inset-inline-end: 12px; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, --bg-- 92%, transparent); color: --text--; font-size: 18px; transition: transform 0.3s ease; }
  .modulex-deger-doku-karo--acik .modulex-deger-doku-karo-buyut { transform: rotate(180deg); }
  @media (max-width: 1024px) {
    .modulex-deger-doku-karo-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    .modulex-deger-doku-karo-bento { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(200px, auto); }
    .modulex-deger-doku-karo-karo--ana, .modulex-deger-doku-karo-karo:has(.modulex-deger-doku-karo--acik), .modulex-deger-doku-karo-karo:last-child:nth-child(4n) { grid-column: auto; grid-row: auto; }
    .modulex-deger-doku-karo-kmetin { -webkit-line-clamp: 8; }
  }
  .modulex-deger-doku-karo-bag { color: inherit; text-decoration: none; }
  .modulex-deger-doku-karo-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-doku-karo-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-doku-karo :is(.modulex-deger-doku-karo-baslik, .modulex-deger-doku-karo-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-doku-karo-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-deger-doku-karo-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-deger-doku-karo { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-doku-karo *, .modulex-deger-doku-karo *::before, .modulex-deger-doku-karo *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-doku-karo";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cevir = (s, P) => {
        s.querySelectorAll("[data-cevir]").forEach((k) => {
          const tog = () => { const a = k.classList.toggle(P + "--acik"); k.setAttribute("aria-expanded", String(a)); };
          k.addEventListener("click", (e) => { if (!e.target.closest("a")) tog(); });
          k.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cevir(s, P, az);
    });
  })();
</script>
